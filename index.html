<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zap/Discord 3.0 — Chat Completo</title>
<style>
  /* Reset e estilo base */
  * {
    margin: 0; padding: 0; box-sizing: border-box;
  }
  body, html {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    height: 100vh;
    background: #181a2a;
    color: #eee;
    display: flex;
    flex-direction: column;
  }
  header, footer {
    background: #262a48;
    text-align: center;
    padding: 15px;
    user-select: none;
  }
  header h1 {
    letter-spacing: 1.3px;
  }
  #app {
    flex: 1;
    display: flex;
    overflow: hidden;
    height: calc(100vh - 100px);
  }
  /* Sidebar */
  #sidebar {
    width: 280px;
    background: #22263e;
    display: flex;
    flex-direction: column;
  }
  #sidebar header {
    padding: 20px;
    border-bottom: 1px solid #3c4163;
    text-align: center;
    font-weight: 600;
    font-size: 22px;
    color: #61dafb;
    user-select: none;
  }
  #channels, #usersOnline {
    flex: 1;
    overflow-y: auto;
    padding: 10px 15px;
  }
  /* Canais */
  .channels-title, .users-title {
    font-weight: 700;
    margin-bottom: 10px;
    border-bottom: 1px solid #3c4163;
    padding-bottom: 6px;
    text-transform: uppercase;
    font-size: 14px;
    color: #9ab1d9;
  }
  .channel, .user {
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 6px;
    background: #2e3250;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    user-select: none;
    transition: background-color 0.2s ease;
  }
  .channel:hover, .user:hover {
    background: #4d56a5;
  }
  .channel.selected {
    background-color: #61dafb;
    color: #22263e;
    font-weight: 700;
  }
  .channel.private::after {
    content: "🔒";
    margin-left: 6px;
  }
  /* Status usuário */
  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 10px;
  }
  .status-online { background: #6bd16d; }
  .status-away { background: #e0be6a; }
  .status-busy { background: #e95f62; }
  .status-offline { background: #878787; }
  /* Main chat area */
  #chatArea {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #282c4a;
  }
  /* Chat Header */
  #chatHeader {
    padding: 18px 20px;
    font-weight: 600;
    font-size: 20px;
    color: #61dafb;
    border-bottom: 1px solid #3c4163;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #chatHeader .channelType {
    font-size: 14px;
    font-weight: 600;
    font-style: italic;
    color: #a2a6b1;
  }
  /* Chat messages */
  #messages {
    flex: 1;
    padding: 18px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .message {
    background: #3e427b;
    color: white;
    padding: 14px 18px;
    border-radius: 12px;
    max-width: 70%;
    position: relative;
    font-size: 16px;
    word-wrap: break-word;
  }
  .message.own {
    background: #61dafb;
    color: #22263e;
    align-self: flex-end;
  }
  .message .meta {
    font-size: 12px;
    color: #ccd6f6cc;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .message .text {
    white-space: pre-wrap;
  }
  .mention {
    color: #82d4ff;
    font-weight: 700;
    cursor: pointer;
  }
  /* Reactions container */
  .reactions {
    margin-top: 8px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .reaction {
    background: #555aa3;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 15px;
    cursor: pointer;
    user-select: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background-color 0.3s ease;
  }
  .reaction:hover {
    background: #82d4ff;
    color: #22263e;
  }
  /* Input area */
  #inputArea {
    padding: 16px 20px;
    background: #22263e;
    display: flex;
    align-items: center;
  }
  #messageInput {
    flex: 1;
    padding: 12px 18px;
    border-radius: 30px;
    border: none;
    font-size: 17px;
    outline: none;
    background: #3c4163;
    color: white;
    font-weight: 500;
  }
  #sendButton {
    margin-left: 16px;
    background: #61dafb;
    border: none;
    color: #22263e;
    font-weight: 700;
    font-size: 17px;
    border-radius: 30px;
    padding: 12px 20px;
    cursor: pointer;
    user-select: none;
    transition: background-color 0.3s ease;
  }
  #sendButton:disabled {
    background: #4a90e29e;
    cursor: not-allowed;
  }
  #sendButton:hover:not(:disabled) {
    background: #4db8ff;
  }
  /* Upload image preview */
  #imagePreview {
    max-width: 100px;
    max-height: 100px;
    border-radius: 16px;
    margin-left: 20px;
    object-fit: cover;
    border: 2px solid #61dafb;
    display: none;
    cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <h1>Zap/Discord 3.0</h1>
</header>

<div id="app">
  <aside id="sidebar">
    <header>Canais</header>
    <div id="channels">
      <!-- Canais serão carregados aqui -->
    </div>
    <button id="btnNewChannel" title="Criar canal" style="margin:10px;">➕ Criar Canal</button>

    <header style="margin-top:16px;">Usuários Online</header>
    <div id="usersOnline">
      <!-- Usuários online -->
    </div>
  </aside>

  <main id="chatArea" aria-live="polite" aria-relevant="additions" role="region">
    <div id="chatHeader">
      <span id="channelName">Nenhum canal selecionado</span>
      <span id="channelType" style="font-style:italic; font-size:14px; color:#9ab1d9;"></span>
    </div>
    <div id="messages">Selecione um canal para começar a conversar.</div>

    <div id="inputArea">
      <input type="file" id="imageInput" accept="image/*" style="display:none;" />
      <img id="imagePreview" alt="Preview imagem" title="Clique para remover imagem"/>
      <input type="text" id="messageInput" placeholder="Digite sua mensagem..." autocomplete="off" disabled />
      <button id="sendButton" disabled>Enviar</button>
      <button id="btnUploadImage" title="Enviar imagem" style="margin-left:10px; background:#4a90e2; border:none; color:white; border-radius:50%; width:36px; height:36px; cursor:pointer;">📷</button>
    </div>
  </main>
</div>

<footer>
  <small>© 2024 Zap/Discord 3.0 — Chat moderno com Interface Própria</small>
</footer>


<script>
(() => {
  // Simulação em memória para canais, usuários e mensagens para interface própria
  const channels = [
    { id: "demo1", nome:"geral", categoria:"Comunicação", tipo:"publico" },
    { id: "demo2", nome:"vip", categoria:"Privado", tipo:"privado" }
  ];

  const users = [
    { id: "u1", name: "Alice", status: "online" },
    { id: "u2", name: "Bob", status: "away" },
    { id: "u3", name: "Ana Clara", status: "busy" },
    { id: "u4", name: "Carlos", status: "offline" }
  ];

  let messages = {
    demo1: [
      { id: "m1", userId: "u1", userName:"Alice", text:"Olá, mundo!", timestamp: new Date(), reactions: {}, imageURL: null },
      { id: "m2", userId: "u2", userName:"Bob", text:"Seja bem-vindo ao canal geral", timestamp: new Date(), reactions: {}, imageURL: null }
    ],
    demo2: [
      { id: "m3", userId: "u3", userName:"Ana Clara", text:"Canal VIP só para convidados!", timestamp: new Date(), reactions: {}, imageURL: null }
    ]
  };

  // Usuário atual fixo para interface (sem login real)
  const currentUser = { uid: "u1", name: "Alice", email: "alice@example.com" };

  // Elementos DOM
  const appDiv = document.getElementById("app");
  const channelsDiv = document.getElementById("channels");
  const usersOnlineDiv = document.getElementById("usersOnline");
  const channelNameSpan = document.getElementById("channelName");
  const channelTypeSpan = document.getElementById("channelType");
  const messagesDiv = document.getElementById("messages");
  const messageInput = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");
  const btnNewChannel = document.getElementById("btnNewChannel");
  const imageInput = document.getElementById("imageInput");
  const imagePreview = document.getElementById("imagePreview");
  const btnUploadImage = document.getElementById("btnUploadImage");

  let currentChannelId = null;
  let uploadImageFile = null;

  // Renderiza canais na sidebar
  function renderChannels() {
    channelsDiv.innerHTML = "";
    channels.forEach(ch => {
      const div = document.createElement("div");
      div.className = "channel" + (ch.id === currentChannelId ? " selected" : "");
      if (ch.tipo === "privado") div.classList.add("private");
      div.textContent = `# ${ch.nome}`;
      div.title = `Categoria: ${ch.categoria} - Tipo: ${ch.tipo}`;
      div.addEventListener("click", () => selectChannel(ch));
      channelsDiv.appendChild(div);
    });
  }

  // Renderiza usuários online com status
  function renderUsersOnline() {
    usersOnlineDiv.innerHTML = "";
    users.forEach(u => {
      const div = document.createElement("div");
      div.className = "user";
      const dot = document.createElement("span");
      dot.classList.add("status-dot", `status-${u.status}`);
      div.appendChild(dot);

      const span = document.createElement("span");
      span.textContent = u.name;
      div.appendChild(span);
      usersOnlineDiv.appendChild(div);
    });
  }

  // Renderiza mensagens do canal atual
  function renderMessages() {
 messagesDiv.innerHTML = "";
    if (!currentChannelId) {
      messagesDiv.textContent = "Selecione um canal para começar a conversar.";
      return;
    }
    const msgs = messages[currentChannelId] || [];
    if (msgs.length === 0) {
      messagesDiv.textContent = "Nenhuma mensagem neste canal.";
      return;
    }
    msgs.forEach(msg => {
      messagesDiv.appendChild(createMessageElement(msg));
    });
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  // Cria elemento de mensagem
  function createMessageElement(msg) {
    const div = document.createElement("div");
    div.className = "message";
    if (msg.userId === currentUser.uid) div.classList.add("own");

    const metaSpan = document.createElement("div");
    metaSpan.className = "meta";
    metaSpan.textContent = `${msg.userName || "Usuário"} - ${msg.timestamp.toLocaleTimeString()}`;
    div.appendChild(metaSpan);

    const textDiv = document.createElement("div");
    textDiv.className = "text";
    textDiv.innerHTML = parseMentions(msg.text);
    div.appendChild(textDiv);

    // Reactions container
    if (msg.reactions && Object.keys(msg.reactions).length) {
      const reactionsDiv = document.createElement("div");
      reactionsDiv.className = "reactions";
      for (const emoji in msg.reactions) {
        const btn = document.createElement("button");
        btn.className = "reaction";
        btn.textContent = emoji + " " + msg.reactions[emoji].length;
        btn.title = "Clique para reagir";
        btn.onclick = () => toggleReaction(msg.id, emoji);
        reactionsDiv.appendChild(btn);
      }
      div.appendChild(reactionsDiv);
    }

    // Editar e apagar só para própria mensagem
    if (msg.userId === currentUser.uid) {
      const btnEdit = document.createElement("button");
      btnEdit.textContent = "✏️";
      btnEdit.title = "Editar mensagem";
      btnEdit.style.marginLeft = "10px";
      btnEdit.onclick = () => editMessage(msg.id);
      div.appendChild(btnEdit);

      const btnDel = document.createElement("button");
      btnDel.textContent = "🗑️";
      btnDel.title = "Apagar mensagem";
      btnDel.style.marginLeft = "6px";
      btnDel.onclick = () => deleteMessage(msg.id);
      div.appendChild(btnDel);
    }

    if (msg.imageURL) {
      const img = document.createElement("img");
      img.src = msg.imageURL;
      img.style.maxWidth = "100%";
      img.style.marginTop = "10px";
      img.style.borderRadius = "12px";
      div.appendChild(img);
    }

    return div;
  }

  // Parse menções @usuario (estático)
  function parseMentions(text){
    if(!text) return "";
    return text.replace(/@(\w+)/g, `<span class="mention" tabindex="0" title="Mencionado: @$1">@${"$1"}</span>`);
  }

  // Seleciona canal
  function selectChannel(channel){
    currentChannelId = channel.id;
    channelNameSpan.textContent = channel.nome;
    channelTypeSpan.textContent = channel.tipo.toUpperCase();
    messageInput.disabled = false;
    messageInput.value = "";
    sendButton.disabled = true;
    uploadImageFile = null;
    imagePreview.style.display = "none";
    renderChannels();
    renderMessages();
  }

  // Envia mensagem (texto + imagem simulada)
  function sendMessage(){
    if (!messageInput.value.trim() && !uploadImageFile) return;

    let imageURL = null;
    if (uploadImageFile) {
      // Simular upload e gerar URL base64
      imageURL = imagePreview.src;
    }

    const newMsg = {
      id: "m" + Date.now(),
      userId: currentUser.uid,
      userName: currentUser.name,
      text: messageInput.value.trim(),
      timestamp: new Date(),
      reactions: {},
      imageURL: imageURL
    };

    if (!messages[currentChannelId]) messages[currentChannelId] = [];
    messages[currentChannelId].push(newMsg);

    messageInput.value = "";
    clearImagePreview();
    renderMessages();
    sendButton.disabled = true;
  }

  // Toggle reação (adiciona/remove emoji)
  function toggleReaction(messageId, emoji) {
    const msgs = messages[currentChannelId];
    if (!msgs) return;

    const msg = msgs.find(m => m.id === messageId);
    if (!msg) return;

    if (!msg.reactions) msg.reactions = {};
    if (!msg.reactions[emoji]) msg.reactions[emoji] = [];

    const idx = msg.reactions[emoji].indexOf(currentUser.uid);
    if (idx === -1) {
      msg.reactions[emoji].push(currentUser.uid);
    } else {
      msg.reactions[emoji].splice(idx, 1);
      if (msg.reactions[emoji].length === 0) delete msg.reactions[emoji];
    }
    renderMessages();
  }

  // Edita mensagem
  function editMessage(messageId){
    const msgs = messages[currentChannelId];
    if (!msgs) return;

    const msg = msgs.find(m => m.id === messageId);
    if (!msg) return;

    const newText = prompt("Editar mensagem:", msg.text);
    if (newText !== null && newText.trim() !== msg.text) {
      msg.text = newText.trim();
      renderMessages();
    }
  }

  // Apaga mensagem
  function deleteMessage(messageId){
    if (!confirm("Tem certeza que quer apagar essa mensagem?")) return;

    const msgs = messages[currentChannelId];
    if (!msgs) return;

    const index = msgs.findIndex(m => m.id === messageId);
    if (index !== -1) {
      msgs.splice(index, 1);
      renderMessages();
    }
  }

  // Upload imagem preview
  btnUploadImage.addEventListener("click", () => imageInput.click());
  imageInput.addEventListener("change", () => {
    const file = imageInput.files[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) {
      alert("Apenas imagens são permitidas!");
      return;
    }
    uploadImageFile = file;

    const reader = new FileReader();
    reader.onload = e => {
      imagePreview.src = e.target.result;
      imagePreview.style.display = "block";
    };
    reader.readAsDataURL(file);
    updateSendButton();
  });

  imagePreview.addEventListener("click", clearImagePreview);

  function clearImagePreview(){
    uploadImageFile = null;
    imagePreview.src = "";
    imagePreview.style.display = "none";
    imageInput.value = "";
    updateSendButton();
  }

  // Atualiza estado botão enviar
  function updateSendButton(){
    sendButton.disabled = messageInput.value.trim().length === 0 && !uploadImageFile;
  }

  messageInput.addEventListener("input", updateSendButton);

  // Enviar mensagem ao pressionar Enter sem Shift
  messageInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (!sendButton.disabled) sendMessage();
    }
  });

  btnNewChannel.addEventListener("click", () => {
    const nome = prompt("Nome do canal:");
    if (!nome || !nome.trim()) return;
    const categoria = prompt("Categoria:", "Comunicação") || "Comunicação";
    const tipoInput = prompt("Tipo (publico / privado / admin):", "publico") || "publico";
    const tipo = ["publico","privado","admin"].includes(tipoInput.toLowerCase()) ? tipoInput.toLowerCase() : "publico";

    const newChannel = {
      id: "ch" + Date.now(),
      nome: nome.trim(),
      categoria,
      tipo
    };
    channels.push(newChannel);
    renderChannels();
  });

  // Inicialização
  function init() {
    renderChannels();
    renderUsersOnline();
    // Desativa entrada até canal selecionado
    messageInput.disabled = true;
    sendButton.disabled = true;
  }

  init();
})();
</script>

</body>
</html>
