
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVOID Chat ULTRA</title>

<style>
:root {
    --bg: #020617;
    --card: #0f172a;
    --accent: #22c55e;
    --text: #f8fafc;
}

* {
    box-sizing: border-box;
}

body {
    margin:0;
    font-family: Arial;
    background: var(--bg);
    color: var(--text);
    display:flex;
    height:100vh;
}

/* Layout */
.sidebar {
    width: 220px;
    background: var(--card);
    padding: 10px;
    overflow-y:auto;
}

.channel {
    padding:10px;
    border-radius:10px;
    cursor:pointer;
    transition:0.2s;
}

.channel:hover {
    background: rgba(255,255,255,0.1);
}

.channel.active {
    background: var(--accent);
}

/* Chat */
.main {
    flex:1;
    display:flex;
    flex-direction:column;
}

.messages {
    flex:1;
    padding:15px;
    overflow-y:auto;
}

.msg {
    margin-bottom:10px;
    padding:10px;
    border-radius:12px;
    background: var(--card);
    animation: fade 0.3s ease;
}

.msg.me {
    background: var(--accent);
}

@keyframes fade {
    from {opacity:0; transform:translateY(10px)}
    to {opacity:1}
}

/* Input */
.input {
    display:flex;
    padding:10px;
}

input {
    flex:1;
    padding:10px;
    border-radius:10px;
    border:none;
    outline:none;
}

button {
    margin-left:10px;
    padding:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

/* Animations */
.channel, .msg, button {
    transition: all 0.2s ease;
}

button:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<div class="sidebar" id="channels"></div>

<div class="main">
    <div class="messages" id="messages"></div>

    <div class="input">
        <input id="input" placeholder="Mensagem...">
        <button onclick="send()">Enviar</button>
    </div>
</div>

<script>
let user = localStorage.getItem("user") || prompt("Seu nome:");
localStorage.setItem("user", user);

let current = "global";

let channels = ["global"];

function renderChannels(){
    let el = document.getElementById("channels");
    el.innerHTML = "";

    channels.forEach(c => {
        let div = document.createElement("div");
        div.className = "channel " + (c===current ? "active":"");
        div.innerText = "# " + c;
        div.onclick = () => {
            current = c;
            renderChannels();
            renderMessages();
        };
        el.appendChild(div);
    });
}

function getMsgs(){
    return JSON.parse(localStorage.getItem("msgs_"+current) || "[]");
}

function saveMsgs(msgs){
    localStorage.setItem("msgs_"+current, JSON.stringify(msgs));
}

function renderMessages(){
    let el = document.getElementById("messages");
    el.innerHTML = "";

    getMsgs().forEach((m,i)=>{
        let div = document.createElement("div");
        div.className = "msg " + (m.user===user ? "me":"");
        div.innerHTML = "<b>"+m.user+"</b><br>"+m.text;

        // editar
        div.ondblclick = ()=>{
            let novo = prompt("Editar:", m.text);
            if(novo){
                let msgs = getMsgs();
                msgs[i].text = novo;
                saveMsgs(msgs);
                renderMessages();
            }
        };

        // apagar
        div.oncontextmenu = (e)=>{
            e.preventDefault();
            if(confirm("Apagar?")){
                let msgs = getMsgs();
                msgs.splice(i,1);
                saveMsgs(msgs);
                renderMessages();
            }
        };

        el.appendChild(div);
    });

    el.scrollTop = el.scrollHeight;
}

function send(){
    let input = document.getElementById("input");
    let text = input.value.trim();
    if(!text) return;

    let msgs = getMsgs();
    msgs.push({user, text});
    saveMsgs(msgs);

    input.value = "";
    renderMessages();
}

document.getElementById("input").addEventListener("keydown", e=>{
    if(e.key==="Enter") send();
});

renderChannels();
renderMessages();
</script>

</body>
</html>
