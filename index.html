<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MVOID Chat ELITE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- Sidebar Comunidades -->
    <div class="comunidades">
        <button class="com-icon active"><i class="fas fa-home"></i></button>
        <button class="com-icon" id="btn-lista-membros"><i class="fas fa-users"></i></button>
        <button class="com-icon" id="btn-painel-admin"><i class="fas fa-user-shield"></i></button>
    </div>

    <!-- Sidebar Principal -->
    <div class="sidebar" id="sidebar">
        <div class="tabs">
            <div class="tab active" data-tab="grupos">Grupos</div>
            <div class="tab" data-tab="conversas">Conversas</div>
            <div class="tab" data-tab="amigos">Amigos</div>
        </div>

        <div class="side-header">
            <span id="tab-title">GRUPOS</span>
            <span id="btnCriar" class="create-btn">+</span>
        </div>

        <div class="list" id="listaItens"></div>

        <!-- Perfil Rodapé -->
        <div class="perfil-rodape" id="perfil-rodape">
            <div class="avatar" id="avatar-user">👤</div>
            <div class="perfil-info">
                <div id="userName" class="nome"></div>
                <div id="userCargo" class="cargo"></div>
            </div>
            <i class="fas fa-cog" id="btnConfig"></i>
        </div>
    </div>

    <!-- Chat Principal -->
    <div class="main">
        <div class="topbar">
            <div class="top-left">
                <i class="fas fa-bars menu-mobile" id="toggleMenu"></i>
                <span id="chat-header"># <span id="nomeGrupoTop">global</span></span>
            </div>
            <div id="userNameTop"></div>
        </div>

        <div id="mensagens"></div>

        <div class="bottom">
            <div class="input-wrapper">
                <input id="msgInput" placeholder="Digite sua mensagem..." autocomplete="off">
                <button class="btn-send" id="btnEnviar"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- Modais -->
    <div id="modalGrupo" class="modal"> ... (vou manter simples por enquanto) </div>
    <div id="modalConfig" class="modal"> ... </div>
    <div id="modalMembros" class="modal"> ... </div>

    <!-- Modal de Opções de Mensagem -->
    <div id="modalMsgOptions" class="modal"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
