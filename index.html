<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wrocket</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0b0f19;
    --sidebar: #111827;
    --card: #1f2937;
    --border: #1f2937;
    --accent: #22c55e;
    --accent-hover: #16a34a;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --msg-me: #166534;
    --msg-other: #1e293b;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
}

/* ===== BARRA LATERAL ESQUERDA (COMUNIDADES) ===== */
.comunidades {
    width: 68px;
    background: #020617;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 0;
    gap: 12px;
    border-right: 1px solid var(--border);
}

.com-icon {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: #1e293b;
    border: none;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 18px;
}

.com-icon:hover,
.com-icon.active {
    background: var(--accent);
    border-radius: 12px;
}

.plus-btn {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    box-shadow: 0 0 12px rgba(34, 197, 94, 0.35);
}

.plus-btn:hover {
    transform: scale(1.06);
}

/* ===== SIDEBAR DE CANAIS ===== */
.sidebar {
    width: 240px;
    background: var(--sidebar);
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
}

.side-header {
    padding: 18px 16px 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.group-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 10px;
}

.group-item {
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 4px;
    color: var(--text-muted);
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.15s ease;
}

.group-item:hover {
    background: rgba(255,255,255,0.05);
    color: white;
}

.group-item.active {
    background: rgba(34, 197, 94, 0.12);
    color: var(--accent);
    font-weight: 500;
}

.group-item i {
    font-size: 13px;
    opacity: 0.7;
}

/* ===== ÁREA PRINCIPAL ===== */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    min-width: 0;
}

.topbar {
    height: 56px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: rgba(11, 15, 25, 0.85);
    backdrop-filter: blur(8px);
}

#canalNomeTopo {
    font-weight: 600;
    font-size: 16px;
}

#mensagens {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
}

.msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.45;
    word-break: break-word;
    animation: fadeIn 0.15s ease;
}

.msg.eu {
    align-self: flex-end;
    background: var(--msg-me);
    border-bottom-right-radius: 4px;
}

.msg.outro {
    align-self: flex-start;
    background: var(--msg-other);
    border-bottom-left-radius: 4px;
}

.msg b {
    font-size: 13px;
    display: block;
    margin-bottom: 3px;
    opacity: 0.9;
}

.msg .time {
    font-size: 11px;
    opacity: 0.55;
    margin-top: 4px;
    text-align: right;
}

/* ===== BARRA INFERIOR ===== */
.bottom {
    padding: 12px 16px 16px;
    border-top: 1px solid var(--border);
    background: var(--sidebar);
}

.user-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
}

.user-profile {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
}

.avatar {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 15px;
    color: white;
}

.user-info span {
    font-size: 13.5px;
    font-weight: 500;
}

.user-info small {
    font-size: 11px;
    color: var(--text-muted);
}

.input-wrapper {
    display: flex;
    align-items: center;
    background: #1e293b;
    border-radius: 12px;
    padding: 4px 6px 4px 4px;
    border: 1px solid transparent;
    transition: border 0.2s;
}

.input-wrapper:focus-within {
    border-color: rgba(34, 197, 94, 0.4);
}

#msgInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    padding: 11px 12px;
    font-size: 14.5px;
    font-family: inherit;
}

#msgInput::placeholder {
    color: #64748b;
}

.btn-send {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
}

.btn-send:hover {
    background: var(--accent-hover);
    transform: scale(1.05);
}

/* ===== MODAL ===== */
.modal-criar {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
}

.modal-criar.active {
    display: flex;
}

.modal-box {
    width: 90%;
    max-width: 400px;
    background: #111827;
    border-radius: 20px;
    padding: 24px;
    border: 1px solid #1f2937;
    animation: modalIn 0.2s ease;
}

.modal-box h2 {
    font-size: 20px;
    margin-bottom: 18px;
    font-weight: 600;
}

.modal-box input,
.modal-box textarea {
    width: 100%;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 12px 14px;
    color: white;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 12px;
    outline: none;
    resize: none;
}

.modal-box input:focus,
.modal-box textarea:focus {
    border-color: var(--accent);
}

.modal-box textarea {
    min-height: 90px;
}

.privado-area {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 14px 0 20px;
    font-size: 14px;
}

.switch {
    position: relative;
    width: 46px;
    height: 26px;
}

.switch input {
    display: none;
}

.slider {
    position: absolute;
    inset: 0;
    background: #334155;
    border-radius: 999px;
    cursor: pointer;
    transition: 0.2s;
}

.slider::before {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    left: 3px;
    top: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.2s;
}

.switch input:checked + .slider {
    background: var(--accent);
}

.switch input:checked + .slider::before {
    transform: translateX(20px);
}

.modal-buttons {
    display: flex;
    gap: 10px;
}

.modal-buttons button {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: 0.15s;
}

#btnCancelarGrupo {
    background: #1e293b;
    color: white;
}

#btnCriarGrupoFinal {
    background: var(--accent);
    color: white;
}

#btnCriarGrupoFinal:hover {
    background: var(--accent-hover);
}

/* ===== ANIMAÇÕES ===== */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
}

@keyframes modalIn {
    from { opacity: 0; transform: scale(0.95); }
    to   { opacity: 1; transform: scale(1); }
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar {
    width: 5px;
}
::-webkit-scrollbar-thumb {
    background: #334155;
    border-radius: 10px;
}

/* ===== MOBILE ===== */
@media (max-width: 768px) {
    .sidebar {
        width: 190px;
    }
    .comunidades {
        width: 60px;
    }
    .msg {
        max-width: 88%;
    }
    .modal-box {
        padding: 20px;
    }
}
</style>
</head>
<body>

<!-- BARRA DE COMUNIDADES -->
<div class="comunidades">
    <button class="com-icon active" title="Início">
        <i class="fas fa-home"></i>
    </button>
    <button class="com-icon plus-btn" id="btn-add" title="Criar canal">
        <i class="fas fa-plus"></i>
    </button>
</div>

<!-- SIDEBAR DE CANAIS -->
<div class="sidebar">
    <div class="side-header">
        Canais
    </div>
    <div class="group-list" id="listaGrupos"></div>
</div>

<!-- ÁREA PRINCIPAL -->
<div class="main">
    <div class="topbar">
        <div id="canalNomeTopo"># selecione um canal</div>
    </div>

    <div id="mensagens">
        <div class="empty-state">
            Selecione ou crie um canal para começar
        </div>
    </div>

    <div class="bottom">
        <div class="user-bar">
            <div class="user-profile" id="btnEditarNome" title="Clique para mudar o nome">
                <div class="avatar" id="avatar">?</div>
                <div class="user-info">
                    <span id="userNameBottom">Usuário</span>
                    <small>Online</small>
                </div>
            </div>
        </div>

        <div class="input-wrapper">
            <input id="msgInput" placeholder="Escreva uma mensagem..." autocomplete="off">
            <button class="btn-send" id="btnEnviar">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<!-- MODAL CRIAR CANAL -->
<div class="modal-criar" id="modalCriarGrupo">
    <div class="modal-box">
        <h2>Novo canal</h2>

        <input type="text" id="grupoNome" placeholder="Nome do canal" maxlength="40">
        <textarea id="grupoDescricao" placeholder="Descrição (opcional)" maxlength="200"></textarea>

        <div class="privado-area">
            <span>Canal privado</span>
            <label class="switch">
                <input type="checkbox" id="grupoPrivado">
                <span class="slider"></span>
            </label>
        </div>

        <div class="modal-buttons">
            <button id="btnCancelarGrupo">Cancelar</button>
            <button id="btnCriarGrupoFinal">Criar</button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    query,
    orderBy,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAHdmvUzkJBqd0nBLL2rWIb30LFEeWtnbw",
    authDomain: "zap-proprio-web.firebaseapp.com",
    projectId: "zap-proprio-web",
    storageBucket: "zap-proprio-web.firebasestorage.app",
    messagingSenderId: "974920784341",
    appId: "1:974920784341:web:8eb8b14928d01a9ed3855c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const mensagensEl = document.getElementById("mensagens");
const input = document.getElementById("msgInput");
const listaGrupos = document.getElementById("listaGrupos");
const canalNomeTopo = document.getElementById("canalNomeTopo");
const userNameBottom = document.getElementById("userNameBottom");
const avatarEl = document.getElementById("avatar");

let nome = localStorage.getItem("nome") || "";
let canalAtual = null;
let unsubscribeMensagens = null;

// ===== NOME DO USUÁRIO =====
function atualizarUIUsuario() {
    userNameBottom.textContent = nome;
    avatarEl.textContent = nome.charAt(0).toUpperCase() || "?";
}

if (!nome.trim()) {
    nome = prompt("Como você quer ser chamado?") || "Anônimo";
    localStorage.setItem("nome", nome);
}
atualizarUIUsuario();

document.getElementById("btnEditarNome").onclick = () => {
    const novo = prompt("Novo nome:", nome);
    if (novo && novo.trim()) {
        nome = novo.trim();
        localStorage.setItem("nome", nome);
        atualizarUIUsuario();
    }
};

// ===== ENVIAR MENSAGEM =====
async function enviar() {
    if (!canalAtual) return;

    const texto = input.value.trim();
    if (!texto) return;

    await addDoc(collection(db, "canais", canalAtual, "mensagens"), {
        nome,
        texto,
        data: serverTimestamp()
    });

    input.value = "";
    input.focus();
}

document.getElementById("btnEnviar").onclick = enviar;

input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        enviar();
    }
});

// ===== CARREGAR MENSAGENS =====
function carregarMensagens() {
    if (unsubscribeMensagens) unsubscribeMensagens();

    const q = query(
        collection(db, "canais", canalAtual, "mensagens"),
        orderBy("data", "asc")
    );

    unsubscribeMensagens = onSnapshot(q, (snap) => {
        mensagensEl.innerHTML = "";

        if (snap.empty) {
            mensagensEl.innerHTML = `
                <div class="empty-state">
                    Nenhuma mensagem ainda.<br>Seja o primeiro a falar 🚀
                </div>`;
            return;
        }

        snap.forEach((docSnap) => {
            const m = docSnap.data();
            const div = document.createElement("div");
            div.className = "msg " + (m.nome === nome ? "eu" : "outro");

            let hora = "";
            if (m.data?.toDate) {
                const d = m.data.toDate();
                hora = d.toLocaleTimeString("pt-BR", {
                    hour: "2-digit",
                    minute: "2-digit"
                });
            }

            div.innerHTML = `
                <b>${m.nome}</b>
                <div>${m.texto}</div>
                ${hora ? `<div class="time">${hora}</div>` : ""}
            `;
            mensagensEl.appendChild(div);
        });

        mensagensEl.scrollTop = mensagensEl.scrollHeight;
    });
}

// ===== LISTA DE CANAIS =====
onSnapshot(collection(db, "canais"), (snap) => {
    listaGrupos.innerHTML = "";

    if (snap.empty) {
        listaGrupos.innerHTML = `
            <div style="padding:16px; color:#64748b; font-size:13px; text-align:center;">
                Nenhum canal ainda.<br>Crie o primeiro!
            </div>`;
        return;
    }

    snap.forEach((docSnap) => {
        const canal = docSnap.data();
        const div = document.createElement("div");
        div.className = "group-item";
        if (canalAtual === docSnap.id) div.classList.add("active");

        div.innerHTML = `
            <i class="fas fa-hashtag"></i>
            <span>${canal.nome}</span>
        `;

        div.onclick = () => {
            document.querySelectorAll(".group-item").forEach(el => el.classList.remove("active"));
            div.classList.add("active");

            canalAtual = docSnap.id;
            canalNomeTopo.textContent = "# " + canal.nome;
            carregarMensagens();
        };

        // Seleciona o primeiro canal automaticamente
        if (!canalAtual) {
            canalAtual = docSnap.id;
            div.classList.add("active");
            canalNomeTopo.textContent = "# " + canal.nome;
            carregarMensagens();
        }

        listaGrupos.appendChild(div);
    });
});

// ===== MODAL CRIAR CANAL =====
const modal = document.getElementById("modalCriarGrupo");

document.getElementById("btn-add").onclick = () => {
    modal.classList.add("active");
    document.getElementById("grupoNome").focus();
};

document.getElementById("btnCancelarGrupo").onclick = () => {
    modal.classList.remove("active");
};

modal.onclick = (e) => {
    if (e.target === modal) modal.classList.remove("active");
};

document.getElementById("btnCriarGrupoFinal").onclick = async () => {
    const nomeGrupo = document.getElementById("grupoNome").value.trim();
    const descricao = document.getElementById("grupoDescricao").value.trim();
    const privado = document.getElementById("grupoPrivado").checked;

    if (!nomeGrupo) {
        document.getElementById("grupoNome").focus();
        return;
    }

    await addDoc(collection(db, "canais"), {
        nome: nomeGrupo,
        descricao,
        privado,
        criadoPor: nome,
        data: serverTimestamp()
    });

    // Limpa e fecha
    document.getElementById("grupoNome").value = "";
    document.getElementById("grupoDescricao").value = "";
    document.getElementById("grupoPrivado").checked = false;
    modal.classList.remove("active");
};
</script>
</body>
</html>
