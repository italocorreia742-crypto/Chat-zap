<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zap/Discord 3.0 com Firebase Real</title>
<style>
  /* (Use o CSS do seu projeto original para manter estilo) */
  body,html { margin:0; padding:0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background:#181a2a; color:#eee; height:100vh; display:flex; flex-direction:column;}
  header,footer {background:#262a48; padding:15px; text-align:center; user-select:none;}
  #app {flex:1; display:flex; overflow:hidden;}
  #sidebar {width:280px; background:#22263e; display:flex; flex-direction:column;}
  #channels, #usersOnline {flex:1; overflow-y:auto; padding:10px 15px;}
  .channel, .user {padding:8px 12px; border-radius:6px; margin-bottom:6px; background:#2e3250; cursor:pointer; display:flex; align-items:center; justify-content:space-between; user-select:none; transition:background-color 0.2s ease;}
  .channel.selected {background:#61dafb; color:#22263e; font-weight:700;}
  .status-dot {width:10px; height:10px; border-radius:50%; margin-right:10px;}
  .status-online {background:#6bd16d;}
  .status-offline {background:#878787;}
  #chatArea {flex:1; display:flex; flex-direction:column; background:#282c4a;}
  #chatHeader {padding:18px 20px; font-weight:600; font-size:20px; color:#61dafb; border-bottom:1px solid #3c4163; display:flex; justify-content:space-between; align-items:center;}
  #messages {flex:1; padding:18px 20px; overflow-y:auto; display:flex; flex-direction:column; gap:14px;}
  .message {background:#3e427b; color:white; padding:14px 18px; border-radius:12px; max-width:70%; font-size:16px; word-wrap:break-word; position:relative;}
  .message.own {background:#61dafb; color:#22263e; align-self:flex-end;}
  .message .meta {font-size:12px; color:#ccd6f6cc; margin-bottom:6px;font-weight:600;}
  .message .text {white-space:pre-wrap; cursor: pointer;}
  .mention {color:#82d4ff; font-weight:700; cursor:pointer;}
  .message .reply {border-left: 3px solid #fff59d; margin-bottom: 6px; padding-left: 8px; font-size: 14px; color: #fff59d;}
  #inputArea {padding:16px 20px; background:#22263e; display:flex; align-items:center;}
  #messageInput {flex:1; padding:12px 18px; border-radius:30px; border:none; font-size:17px; outline:none; background:#3c4163; color:white; font-weight:500;}
  #sendButton {margin-left:16px; background:#61dafb; border:none; color:#22263e; font-weight:700; font-size:17px; border-radius:30px; padding:12px 20px; cursor:pointer; user-select:none; transition:background-color 0.3s ease;}
  #sendButton:disabled {background:#4a90e29e; cursor:not-allowed;}
  #sendButton:hover:not(:disabled) {background:#4db8ff;}
  #btnNewChannel, #btnUploadImage {cursor:pointer;}
</style>
</head>
<body>

<header>
  <h1>Zap/Discord 3.0 com Firebase Real</h1>
  <div id="userInfo" style="margin-top:5px;">
    <span id="userName"></span>
    <button id="btnEditProfile">Editar Perfil</button>
    <button id="btnLogout">Sair</button>
  </div>
</header>

<div id="app" style="display:none;">
  <aside id="sidebar">
    <header>Canais</header>
    <div id="channels"></div>
    <button id="btnNewChannel" title="Criar canal">➕ Criar Canal</button>
    <header style="margin-top:16px;">Usuários Online</header>
    <div id="usersOnline"></div>
  </aside>

  <main id="chatArea" aria-live="polite" aria-relevant="additions" role="region">
    <div id="chatHeader">
      <span id="channelName">Nenhum canal selecionado</span>
      <span id="channelType" style="font-style:italic; font-size:14px; color:#9ab1d9;"></span>
    </div>
    <div id="messages">Selecione um canal para começar a conversar.</div>
    <div id="inputArea">
      <input type="text" id="messageInput" placeholder="Digite sua mensagem..." autocomplete="off" />
      <button id="sendButton" disabled>Enviar</button>
    </div>
  </main>
</div>

<!-- Login Modal -->
<div id="loginWrapper">
  <h2>Entrar no Zap/Discord</h2>
  <input type="email" id="emailInput" placeholder="Email" autocomplete="username" /><br>
  <input type="password" id="passwordInput" placeholder="Senha" autocomplete="current-password" /><br>
  <button id="btnLogin">Entrar</button>
  <div id="loginError" style="color:#db5a5a; margin-top:10px;"></div>

  <p>Não tem conta? <a href="#" id="linkRegister">Registrar</a></p>
</div>

<!-- Edit Profile Modal -->
<div id="editProfileModal" style="display:none; position:fixed; inset:0; background: rgba(0,0,0,0.8); justify-content:center; align-items:center;">
  <div style="background:#22263e; padding:20px; border-radius:8px; width:300px;">
    <h3>Editar Perfil</h3>
    <input type="text" id="profileName" placeholder="Seu nome" style="width:100%; padding:8px; margin-bottom:10px;" />
    <textarea id="profileNote" placeholder="Sua nota/descrição" style="width:100%; height:80px; padding:8px; resize:none;"></textarea>
    <button id="btnSaveProfile" style="margin-top:10px;">Salvar</button>
    <button id="btnCancelProfile" style="margin-top:10px; margin-left:10px;">Cancelar</button>
  </div>
</div>

<script type="module">
// Importe Firebase SDK
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, getDoc, onSnapshot, query, where, orderBy, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

// Config Firebase (substitua pelas suas)
const firebaseConfig = {
  apiKey: "SUA_APIKEY",
  authDomain: "SEU_AUTHDOMAIN",
  projectId: "SEU_PROJECTID",
  storageBucket: "SEU_BUCKET",
  messagingSenderId: "SEU_SENDERID",
  appId: "SEU_APPID"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Elementos DOM
const loginWrapper = document.getElementById("loginWrapper");
const emailInput = document.getElementById("emailInput");
const passwordInput = document.getElementById("passwordInput");
const btnLogin = document.getElementById("btnLogin");
const loginError = document.getElementById("loginError");

const appDiv = document.getElementById('app');
const userNameDisplay = document.getElementById('userName');
const btnLogout = document.getElementById('btnLogout');
const btnEditProfile = document.getElementById('btnEditProfile');

const channelsDiv = document.getElementById('channels');
const usersOnlineDiv = document.getElementById('usersOnline');
const channelNameSpan = document.getElementById('channelName');
const channelTypeSpan = document.getElementById('channelType');
const messagesDiv = document.getElementById('messages');
const messageInput = document.getElementById('messageInput');
const sendButton = document.getElementById('sendButton');
const btnNewChannel = document.getElementById('btnNewChannel');

const editProfileModal = document.getElementById('editProfileModal');
const profileNameInput = document.getElementById('profileName');
const profileNoteInput = document.getElementById('profileNote');
const btnSaveProfile = document.getElementById('btnSaveProfile');
const btnCancelProfile = document.getElementById('btnCancelProfile');

let currentUser = null;
let currentChannel = null;
let unsubscribeMessages = null;
let unsubscribeChannels = null;
let unsubscribeUsers = null;

// Autenticação e UI
btnLogin.onclick = async () => {
  loginError.textContent = "";
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();
  if (!email || !password) {
    loginError.textContent = "Preencha email e senha";
    return;
  }
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (error) {
    if(error.code === 'auth/user-not-found'){
      // Auto registro
      try {
        await createUserWithEmailAndPassword(auth, email, password);
      } catch (err) {
        loginError.textContent = err.message;
      }
    } else {
      loginError.textContent = error.message;
    }
  }
};

onAuthStateChanged(auth, user => {
  if (user) {
    currentUser = user;
    loginWrapper.style.display = "none";
    appDiv.style.display = "flex";
    userNameDisplay.textContent = user.email;
    setupPresence();
    loadChannelsRealtime();
    loadUsersOnlineRealtime();
    disableInput(true);
  } else {
    currentUser = null;
    loginWrapper.style.display = "block";
    appDiv.style.display = "none";
    channelNameSpan.textContent = "Nenhum canal selecionado";
    channelTypeSpan.textContent = "";
    messagesDiv.innerHTML = "";
    channelsDiv.innerHTML = "";
    usersOnlineDiv.innerHTML = "";
    disableInput(true);
    if (unsubscribeMessages) unsubscribeMessages();
    if (unsubscribeChannels) unsubscribeChannels();
    if (unsubscribeUsers) unsubscribeUsers();
  }
});

btnLogout.onclick = () => {
  signOut(auth);
};

// Controle campo de mensagem
messageInput.addEventListener('input', () => {
  sendButton.disabled = !(messageInput.value.trim().length > 0);
});

sendButton.onclick = sendMessage;
messageInput.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    if (!sendButton.disabled) sendMessage();
  }
});

// Controla input habilitado
function disableInput(disabled) {
  messageInput.disabled = disabled;
  sendButton.disabled = disabled || messageInput.value.trim().length === 0;
}

// Canais - usando listener geral
function loadChannelsRealtime(){
  const canaisRef = collection(db, "canais");
  unsubscribeChannels = onSnapshot(canaisRef, querySnapshot => {
    channelsDiv.innerHTML = "";
    querySnapshot.forEach(docSnap => {
      const ch = docSnap.data();
      const div = document.createElement("div");
      div.className = "channel";
      if(ch.id === currentChannel?.id) div.classList.add("selected");
      div.textContent = `# ${ch.nome}`;
      div.title = `Descrição: ${ch.descricao || ''}\nTipo: ${ch.tipo}`;
      div.onclick = () => selectChannel(docSnap.id, ch);
      channelsDiv.appendChild(div);
    });
  });
}

async function selectChannel(channelId, channelData){
  if(unsubscribeMessages) unsubscribeMessages();
  currentChannel = {id: channelId, ...channelData};
  channelNameSpan.textContent = channelData.nome;
  channelTypeSpan.textContent = channelData.tipo.toUpperCase();
  messagesDiv.innerHTML = "Carregando mensagens...";
  disableInput(false);
  loadMessagesRealtime(channelId);
}

function loadMessagesRealtime(channelId){
  const mensagensRef = collection(db, "canais", channelId, "mensagens");
  const q = query(mensagensRef, orderBy("timestamp"));
  unsubscribeMessages = onSnapshot(q, querySnap => {
    messagesDiv.innerHTML = "";
    querySnap.forEach(docSnap => {
      const msg = docSnap.data();
      msg.id = docSnap.id;
      messagesDiv.appendChild(createMessageElement(msg));
    });
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  });
}

function createMessageElement(msg){
  const div = document.createElement('div');
  div.className = "message";
  if(msg.usuarioId === currentUser.uid) div.classList.add("own");

  const meta = document.createElement('div');
  meta.className= "meta";
  const date = msg.timestamp?.toDate ? msg.timestamp.toDate() : new Date();
  meta.textContent = `${msg.usuarioNome || 'Usuário'} - ${date.toLocaleTimeString()}`;
  div.appendChild(meta);

  if(msg.respostaId){
    const respostaWrap = document.createElement('div');
    respostaWrap.className = "reply";
    respostaWrap.textContent = `Resposta a: ${msg.respostaTexto || '(texto não encontrado)'}`;
    div.appendChild(respostaWrap);
  }

  const texto = document.createElement('div');
  texto.className = 'text';
  texto.innerHTML = highlightMentions(msg.texto || "");
  div.appendChild(texto);

  // Botões edição/exclusão para próprias mensagens
  if(msg.usuarioId === currentUser.uid){
    const btnEdit = document.createElement('button');
    btnEdit.textContent = "✏️";
    btnEdit.title = "Editar mensagem";
    btnEdit.style.marginLeft = "10px";
    btnEdit.onclick = () => editMessage(msg.id);
    div.appendChild(btnEdit);

    const btnDel = document.createElement('button');
    btnDel.textContent = "🗑️";
    btnDel.title = "Apagar mensagem";
    btnDel.style.marginLeft = "6px";
    btnDel.onclick = () => deleteMessage(msg.id);
    div.appendChild(btnDel);
  }

  // Clique em mensagem para responder
  texto.onclick = () => startReplying(msg.id, msg.texto);

  return div;
}

function highlightMentions(text){
  return text.replace(/@(\w+)/g, `<span class="mention">@${"$1"}</span>`);
}

// Funções enviar/edit/delete mensagens
async function sendMessage(){
  const texto = messageInput.value.trim();
  if (!texto || !currentChannel) return;

  let mensagem = {
    texto,
    usuarioId: currentUser.uid,
    usuarioNome: currentUser.displayName || currentUser.email.split('@')[0],
    timestamp: serverTimestamp()
  };

  // Se estiver respondendo a alguma mensagem
  if (replyTo && replyText) {
    mensagem.respostaId = replyTo;
    mensagem.respostaTexto = replyText;
  }

  try {
    const mensagensRef = collection(db, 'canais', currentChannel.id, 'mensagens');
    await addDoc(mensagensRef, mensagem);
    messageInput.value = "";
    sendButton.disabled = true;
    clearReply();
  } catch (error) {
    alert('Erro ao enviar mensagem: ' + error.message);
  }
}

async function editMessage(msgId) {
  const newText = prompt('Editar mensagem:');
  if (!newText) return;
  const msgDoc = doc(db, 'canais', currentChannel.id, 'mensagens', msgId);
  await updateDoc(msgDoc, { texto: newText });
}

async function deleteMessage(msgId) {
  if (!confirm('Tem certeza que quer apagar essa mensagem?')) return;
  const msgDoc = doc(db, 'canais', currentChannel.id, 'mensagens', msgId);
  await deleteDoc(msgDoc);
}

// Reply controls
let replyTo = null;
let replyText = null;

function startReplying(msgId, text) {
  replyTo = msgId;
  replyText = text;
  messageInput.placeholder = `Respondendo: "${text}" (pressione Esc para cancelar)`;
  messageInput.focus();
}

function clearReply() {
  replyTo = null;
  replyText = null;
  messageInput.placeholder = "Digite sua mensagem...";
}

// Cancelar resposta com Esc
messageInput.addEventListener('keydown', e => {
  if(e.key === "Escape" && replyTo){
    clearReply();
  }
});

// Carrega usuários online (simples)
function loadUsersOnlineRealtime(){
  const usuariosRef = collection(db, "usuarios");
  unsubscribeUsers = onSnapshot(usuariosRef, querySnap => {
    usersOnlineDiv.innerHTML = "";
    querySnap.forEach(docSnap => {
      const u = docSnap.data();
      const div = document.createElement('div');
      div.className = 'user';
      const dot = document.createElement('span');
      dot.className = 'status-dot ' + (u.online ? 'status-online' : 'status-offline');
      div.appendChild(dot);
      const span = document.createElement('span');
      span.textContent = u.nome || u.email || 'Usuário';
      div.appendChild(span);
      usersOnlineDiv.appendChild(div);
    });
  });
}

// Presença simples
function setupPresence(){
  if(!currentUser) return;
  const userDoc = doc(db, 'usuarios', currentUser.uid);
  const userRef = userDoc;
  const setOnline = () => updateDoc(userRef, { online: true, ultimoLogin: serverTimestamp() }).catch(() => {});
  const setOffline = () => updateDoc(userRef, { online: false }).catch(() => {});

  setOnline();
  window.addEventListener('beforeunload', setOffline);
  // Pode melhorar usando RealtimeDatabase onDisconnect para offline confiável
}

// Editar perfil
btnEditProfile.onclick = () => {
  profileNameInput.value = currentUser.displayName || "";
  // Para exemplo, nota salvo localmente
  profileNoteInput.value = localStorage.getItem(`${currentUser.uid}-note`) || "";
  editProfileModal.style.display = 'flex';
};

btnCancelProfile.onclick = () => editProfileModal.style.display = 'none';

btnSaveProfile.onclick = async () => {
  const newName = profileNameInput.value.trim();
  const newNote = profileNoteInput.value.trim();
  if(!newName) return alert('Nome não pode ser vazio');
  try {
    await updateProfile(currentUser, { displayName: newName });
    localStorage.setItem(`${currentUser.uid}-note`, newNote);
    userNameDisplay.textContent = newName;
    editProfileModal.style.display = 'none';
  } catch(e) {
    alert('Erro ao salvar perfil: ' + e.message);
  }
};
</script>

</body>
</html>
