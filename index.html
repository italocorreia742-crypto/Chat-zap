<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MVOID Chat ELITE</title>
    
    <!-- CSS Conectado -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- Sidebar Comunidades -->
    <div class="comunidades">
        <button class="com-icon active"><i class="fas fa-home"></i></button>
        <button class="com-icon" id="btn-lista-membros"><i class="fas fa-users"></i></button>
        <button class="com-icon" id="btn-painel-admin"><i class="fas fa-user-shield"></i></button>
    </div>

    <!-- Sidebar Principal -->
    <div class="sidebar" id="sidebar">
        <div class="tabs">
            <div class="tab active" data-tab="grupos">Grupos</div>
            <div class="tab" data-tab="conversas">Conversas</div>
            <div class="tab" data-tab="amigos">Amigos</div>
        </div>

        <div class="side-header">
            <span id="tab-title">GRUPOS</span>
            <span id="btnCriar" style="cursor:pointer; font-size:24px; color:var(--accent);">+</span>
        </div>

        <div class="list" id="listaItens"></div>

        <!-- Perfil no rodapé -->
        <div class="perfil-rodape">
            <div class="avatar">👤</div>
            <div class="perfil-info">
                <div id="userName" class="nome"></div>
                <div id="userCargo" class="cargo"></div>
            </div>
            <i class="fas fa-cog" id="btnConfig" style="cursor:pointer; font-size:22px"></i>
        </div>
    </div>

    <!-- Chat Principal -->
    <div class="main">
        <div class="topbar">
            <div style="display:flex; align-items:center; gap:12px">
                <i class="fas fa-bars menu-mobile" id="toggleMenu"></i>
                <span># <span id="nomeGrupoTop">global</span></span>
            </div>
            <div id="userNameTop"></div>
        </div>

        <div id="mensagens"></div>

        <div class="bottom">
            <div class="input-wrapper">
                <input id="msgInput" placeholder="Digite sua mensagem..." autocomplete="off">
                <button class="btn-send" id="btnEnviar"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- Modais -->
    <div id="modalGrupo" class="modal">
        <div class="modal-content">
            <h3>Novo Canal</h3>
            <input id="novoNomeGrupo" placeholder="Nome do canal">
            <button class="btn-modal" style="background:var(--accent)" id="confirmarGrupo">CRIAR</button>
            <button class="btn-modal fechar" style="background:none; color:#94a3b8">Cancelar</button>
        </div>
    </div>

    <div id="modalConfig" class="modal">
        <div class="modal-content">
            <h3>Perfil</h3>
            <p>Cargo: <b id="userCargoModal" style="color:var(--accent)"></b></p>
            <input id="editNomeInput" placeholder="Mudar meu nome">
            <button class="btn-modal" style="background:var(--accent)" id="btnSalvarPerfil">SALVAR</button>
            <button class="btn-modal" style="background:var(--danger)" id="btnLogout">SAIR</button>
            <button class="btn-modal fechar" style="background:none; color:#94a3b8">Fechar</button>
        </div>
    </div>

    <div id="modalMembros" class="modal">
        <div class="modal-content">
            <h3>Membros</h3>
            <div id="membrosListaBox"></div>
            <button class="btn-modal fechar" style="background:var(--accent)">Fechar</button>
        </div>
    </div>

    <!-- JavaScript Conectado -->
    <script type="module" src="script.js"></script>
</body>
</html>
