<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wrocket</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --bg-dark: #020617;
    --bg-main: #0f172a;
    --accent: #22c55e;
    --sidebar: #0f172a;
    --text: #f8fafc;
    --danger: #ef4444;
    --card: #1e293b;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: var(--bg-dark);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
}

.comunidades {
    width: 72px;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 12px;
    gap: 12px;
    flex-shrink: 0;
}

.com-icon {
    width: 48px;
    height: 48px;
    background: #334155;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.2s;
    color: white;
    border: none;
}

.com-icon:hover,
.com-icon.active {
    border-radius: 16px;
    background: var(--accent);
}

.sidebar {
    width: 240px;
    background: var(--sidebar);
    display: flex;
    flex-direction: column;
    border-right: 1px solid #1e293b;
}

.side-header {
    padding: 15px;
    font-weight: bold;
    font-size: 14px;
    color: #94a3b8;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #1e293b;
}

.group-list {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
}

.group-item {
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 6px;
    background: rgba(255,255,255,0.03);
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #1e293b;
}

.topbar {
    height: 55px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #0f172a;
}

#mensagens {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.msg {
    padding: 12px;
    border-radius: 14px;
    max-width: 85%;
}

.msg.eu {
    align-self: flex-end;
    background: var(--accent);
}

.msg.outro {
    align-self: flex-start;
    background: var(--card);
}

.bottom {
    padding: 15px;
}

.input-wrapper {
    background: #334155;
    border-radius: 14px;
    display: flex;
    align-items: center;
}

#msgInput {
    flex: 1;
    background: none;
    border: none;
    padding: 14px;
    color: white;
    outline: none;
}

.btn-send {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: white;
    cursor: pointer;
    margin-right: 8px;
}
</style>
</head>

<body>

<div class="comunidades">
    <button class="com-icon active">
        <i class="fas fa-home"></i>
    </button>
</div>

<div class="sidebar">
    <div class="side-header">
        CANAIS
    </div>

    <div class="group-list" id="listaGrupos"></div>
</div>

<div class="main">

    <div class="topbar">
        <div># global</div>
    </div>

    <div id="mensagens"></div>

    <div class="bottom">
        <div class="input-wrapper">
            <input id="msgInput" placeholder="Sua mensagem..." autocomplete="off">

            <button class="btn-send" id="btnEnviar">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    query,
    orderBy,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAHdmvUzkJBqd0nBLL2rWIb30LFEeWtnbw",
    authDomain: "zap-proprio-web.firebaseapp.com",
    projectId: "zap-proprio-web",
    storageBucket: "zap-proprio-web.firebasestorage.app",
    messagingSenderId: "974920784341",
    appId: "1:974920784341:web:8eb8b14928d01a9ed3855c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const mensagens = document.getElementById("mensagens");
const input = document.getElementById("msgInput");

let nome = localStorage.getItem("nome") || prompt("Seu Nome:");

localStorage.setItem("nome", nome);

async function enviar() {
    let texto = input.value.trim();

    if (!texto) return;

    await addDoc(collection(db, "mensagens"), {
        nome,
        texto,
        data: serverTimestamp()
    });

    input.value = "";
}

document.getElementById("btnEnviar").onclick = enviar;

input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") enviar();
});

const q = query(
    collection(db, "mensagens"),
    orderBy("data", "asc")
);

onSnapshot(q, (snap) => {
    mensagens.innerHTML = "";

    snap.forEach((docSnap) => {
        const m = docSnap.data();

        const div = document.createElement("div");

        div.className = "msg " + (m.nome === nome ? "eu" : "outro");

        div.innerHTML = `
            <b>${m.nome}</b>
            <div>${m.texto}</div>
        `;

        mensagens.appendChild(div);
    });

    mensagens.scrollTop = mensagens.scrollHeight;
});
</script>

</body>
</html>
