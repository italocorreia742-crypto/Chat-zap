<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MVOID Chat ELITE - FINAL</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --bg-dark: #020617;
    --bg-main: #0f172a;
    --accent: #22c55e;
    --sidebar: #0f172a;
    --text: #f8fafc;
    --danger: #ef4444;
    --card: #1e293b;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: var(--bg-dark);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
}

/* Comunidades */
.comunidades {
    width: 72px;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 12px;
    gap: 12px;
}

.com-icon {
    width: 48px;
    height: 48px;
    background: #334155;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.2s;
    color: white;
}

.com-icon:hover,
.com-icon.active {
    border-radius: 16px;
    background: var(--accent);
}

/* Sidebar */
.sidebar {
    width: 240px;
    background: var(--sidebar);
    display: flex;
    flex-direction: column;
    border-right: 1px solid #1e293b;
    transition: 0.3s;
}

.side-header {
    padding: 15px;
    font-weight: bold;
    font-size: 14px;
    color: #94a3b8;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #1e293b;
}

.group-list {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
}

.group-item {
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 4px;
    color: #94a3b8;
}

.group-item.active {
    background: #334155;
    color: white;
}

/* Chat */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #1e293b;
}

#mensagens {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.msg {
    padding: 10px;
    border-radius: 12px;
    max-width: 80%;
}

.msg.eu {
    align-self: flex-end;
    background: var(--accent);
}

.msg.outro {
    background: var(--card);
}

/* Input */
.bottom {
    padding: 15px;
}

.input-wrapper {
    background: #334155;
    border-radius: 12px;
    display: flex;
}

#msgInput {
    flex: 1;
    background: none;
    border: none;
    padding: 12px;
    color: white;
}

.btn-send {
    background: var(--accent);
    border: none;
    width: 40px;
    color: white;
}
</style>
</head>

<body>

<div class="comunidades">
    <button class="com-icon active"><i class="fas fa-home"></i></button>
</div>

<div class="sidebar">
    <div class="side-header">
        CANAIS
        <span id="btnCriar">+</span>
    </div>
    <div class="group-list" id="listaGrupos"></div>
</div>

<div class="main">
    <div id="mensagens"></div>

    <div class="bottom">
        <div class="input-wrapper">
            <input id="msgInput" placeholder="Sua mensagem...">
            <button class="btn-send" id="btnEnviar">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "SUA_KEY",
    authDomain: "SEU_DOMINIO",
    projectId: "SEU_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById("btnEnviar").onclick = async () => {
    const msg = document.getElementById("msgInput").value;

    if (!msg) return;

    await addDoc(collection(db, "mensagens"), {
        texto: msg
    });

    document.getElementById("msgInput").value = "";
};
</script>

</body>
</html>
